# 워크 플로우(작업) 이름
name: GitOps Docker CICD Pipeline
# 1. 트리거 설정: 브렌치 정의
on:
  push:
    branches:
      - main

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 소스코드 전송
        uses: actions/checkout@v4

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}


      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: ${{secrets.AWS_REGION}}

      - name: S3 정적 웹사이트로 배포
        run: |
          aws s3 cp ./docker-compose.yaml s3://${{secrets.S3_BUCKET_NAME}}/docker-compose.yaml

      # ecr에 docker 이미지 빌드 및 푸시
      - name: login to amazon ecr
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: build and push docker image to ecr
        # env:
          # ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          # IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --no-cache -t 925047940866.dkr.ecr.eu-central-1.amazonaws.com/std11/nginx:1.31.3-ecr ./nginx
          docker build --no-cache -t 925047940866.dkr.ecr.eu-central-1.amazonaws.com/std11/nginx:latest ./nginx

          docker push 925047940866.dkr.ecr.eu-central-1.amazonaws.com/std11/nginx:1.31.3-ecr
          docker push 925047940866.dkr.ecr.eu-central-1.amazonaws.com/std11/nginx:latest

      - name: 컨테이너 배포 및 s3 파일 싱크
        run: |
          # aws s3 sync 명령어로 파일 업로드
          aws ssm send-command \
            --instance-ids ${{secrets.EC2_INSTANCE_ID}} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
            "aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin 925047940866.dkr.ecr.eu-central-1.amazonaws.com",
            "docker stop nginx-container || true",
            "docker rm nginx-container || true", 
            "sudo aws s3 cp s3://${{secrets.S3_BUCKET_NAME}}/docker-compose.yaml /docker-compose.yaml",
            "docker compose pull",
            "docker compose up -d --remove-orphans",
            "docker image prune -f"]' \
            --region ${{secrets.AWS_REGION}} \
            --comment "Deploying SSM"