# 프로젝트 이름. 파일을 /docker-compose.yaml 에 두면 이름이 비어서 up 이 실패함
name: nginx

services:
  my-service-web:
    image: 925047940866.dkr.ecr.eu-central-1.amazonaws.com/std11/nginx:latest
    container_name: nginx-container
    ports:
      - "80:80"
    volumes:
      - /home/ec2-user/nginx/html:/usr/share/nginx/html:ro
      - /home/ec2-user/nginx/logs:/var/log/nginx
    restart: always
    networks:
      public-subnet:
        aliases:
          - nginx

networks:
  public-subnet:
    driver: bridge

services:
  fastapi:
    image: 925047940866.dkr.ecr.eu-central-1.amazonaws.com/std11/fastapi:latest
    container_name: fastapi-container
    ports:
      - "8000:8000"
    volumes:
      - /home/ec2-user/fastapi:/app
    restart: always
    networks:
      public-subnet:
        aliases:
          - fastapi