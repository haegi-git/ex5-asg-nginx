# nginx 가 80 에서 듣고, HTML 은 직접 주고 /app/ 은 FastAPI 로 넘김
# proxy_pass 의 호스트 이름 = compose 서비스 이름 (같은 네트워크여야 함)
server {
    listen 80;
    server_name _;

    # 브라우저 /  → 정적 페이지 (index.html)
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # 브라우저 /app/  → FastAPI (uvicorn 8000)
    # 끝 슬래시: /app/docs 가 FastAPI 의 /docs 로 들어감
    location /app/ {
        proxy_pass http://fastapi:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
